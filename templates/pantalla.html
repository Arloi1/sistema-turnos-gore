<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Atención - GORE Cajamarca</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --azul-gore: #003366;
            --azul-claro-gore: #004a99;
            --dorado-gore: #c5a059;
            --fondo-gris: #eef2f7;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            background: var(--fondo-gris); 
            display: flex; 
            flex-direction: column; 
            height: 100vh;
            overflow: hidden;
        }

        .slider-container { 
            width: 100%; 
            height: 52vh; 
            overflow: hidden; 
            position: relative; 
            background-color: #000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        #video-fondo {
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
        
        .turnos-wrapper { 
            flex: 1; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            padding: 5px 20px; 
            gap: 10px;
        }

        #reloj {
            font-size: 2rem; 
            font-weight: 800; 
            color: var(--azul-gore);
            background: rgba(255, 255, 255, 0.9);
            padding: 2px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            letter-spacing: 2px;
        }

        .ventanillas-container { 
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            width: 95%;
            max-width: 1400px;
        }

        .ventanilla { 
            background: #ffffff; 
            padding: 15px 20px; 
            border-radius: 20px; 
            text-align: center; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            border-top: 6px solid var(--azul-claro-gore); 
            border-left: none;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .ventanilla.preferencial {
            border-top: 6px solid var(--dorado-gore);
        }

        .titulo { 
            color: var(--azul-gore); 
            font-size: 1.1rem; 
            font-weight: 800; 
            letter-spacing: 1.5px; 
            margin-bottom: 5px;
        }

        .ventanilla.preferencial .titulo {
            color: var(--dorado-gore);
        }

        .numero { 
            font-size: min(11vw, 110px); 
            font-weight: 900; 
            color: var(--azul-claro-gore); 
            margin: 0; 
            line-height: 1.1;
        }

        .ventanilla.preferencial .numero {
            color: #b38f45;
        }

        @keyframes pulsoCard {
            0% { transform: scale(1); box-shadow: 0 15px 35px rgba(0,0,0,0.08); }
            50% { transform: scale(1.03); box-shadow: 0 0 30px rgba(197, 160, 89, 0.6); }
            100% { transform: scale(1); box-shadow: 0 15px 35px rgba(0,0,0,0.08); }
        }

        .activar-alerta {
            animation: pulsoCard 1.5s ease-in-out infinite;
        }

        .footer-bar {
            width: 100%; 
            height: 75px; 
            background: var(--azul-gore);
            display: flex; 
            align-items: center; 
            justify-content: center;
            box-shadow: -4px 15px rgba(0,0,0,0.1);
        }
        
        .logo-img { 
            height: 50px; 
            object-fit: contain; 
            filter: brightness(0) invert(1); 
        }

        #overlay-inicio {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body onclick="iniciarSistemaUnico()">

    <div id="overlay-inicio">
        <h2 style="color: #c5a059; margin-bottom: 10px;">SISTEMA DE ATENCIÓN - GORE CAJAMARCA</h2>
        <p style="font-size: 1.2rem;">Haz clic en cualquier lugar para iniciar la pantalla con audio y video</p>
    </div>

    <div class="slider-container">
        <video id="video-fondo" autoplay playsinline>
            <source id="source-video" src="" type="video/mp4">
        </video>
    </div>

    <div class="turnos-wrapper">
        <div id="reloj">00:00:00</div>
        
        <div class="ventanillas-container">
            <div class="ventanilla">
                <div class="titulo">VENTANILLA 01</div>
                <div id="turno-Ventanilla-01" class="numero">0</div>
            </div>
            <div class="ventanilla">
                <div class="titulo">VENTANILLA 02</div>
                <div id="turno-Ventanilla-02" class="numero">0</div>
            </div>
            <div class="ventanilla preferencial">
                <div class="titulo">VENTANILLA 03 (PREFERENCIAL)</div>
                <div id="turno-Ventanilla-03" class="numero">0</div>
            </div>
        </div>
    </div>

    <div class="footer-bar">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="GORE Cajamarca" class="logo-img">
    </div>

    <audio id="audio-campana" src="{{ url_for('static', filename='campana.mp3') }}"></audio>

    <script>
        let estadoActual = {"Ventanilla 01": -1, "Ventanilla 02": -1, "Ventanilla 03": -1};
        let vocesDisponibles = [];
        let sistemaIniciado = false;
        
        const videoFondo = document.getElementById('video-fondo');
        const sourceVideo = document.getElementById('source-video');
        
        // Lista de videos que se reproducirán secuencialmente (coloca tus archivos en la carpeta static)
        const listaVideos = [
            "{{ url_for('static', filename='video1.mp4') }}",
            "{{ url_for('static', filename='video2.mp4') }}",
            "{{ url_for('static', filename='video3.mp4') }}"
        ];
        
        let indiceVideoActual = 0;

        function reproducirVideoActual() {
            sourceVideo.src = listaVideos[indiceVideoActual];
            videoFondo.load();
            videoFondo.play().catch(e => console.log("Video play error:", e));
        }

        // Al terminar un video, pasa automáticamente al siguiente de la lista en bucle
        videoFondo.onended = function() {
            indiceVideoActual = (indiceVideoActual + 1) % listaVideos.length;
            reproducirVideoActual();
        };
        
        const VOLUMEN_NORMAL = 0.8; // Volumen habitual del video
        const VOLUMEN_BAJO = 0.15;  // Volumen reducido cuando llama un turno
        videoFondo.volume = VOLUMEN_NORMAL;

        function iniciarSistemaUnico() {
            if (sistemaIniciado) return;
            sistemaIniciado = true;

            videoFondo.muted = false;
            reproducirVideoActual(); // Inicia la reproducción del primer video

            const overlay = document.getElementById('overlay-inicio');
            if (overlay) {
                overlay.style.opacity = '0';
                setTimeout(() => overlay.remove(), 500);
            }
        }

        function cargarVoces() {
            vocesDisponibles = window.speechSynthesis.getVoices();
        }

        cargarVoces();
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = cargarVoces;
        }

        window.onload = function() {
            fetch('/obtener_todos_los_turnos')
                .then(r => r.json())
                .then(data => {
                    Object.keys(data).forEach(nV => {
                        let turno = data[nV];
                        if (turno > 0) {
                            estadoActual[nV] = turno;
                            let elementId = "turno-" + nV.replace(/ /g, "-");
                            let el = document.getElementById(elementId);
                            if (el) el.innerText = turno;
                        }
                    });
                });
        };

        function actualizarReloj() {
            const options = { hour: '2-digit', minute: '2-digit', second: '2-digit' };
            document.getElementById('reloj').innerText = new Date().toLocaleTimeString('es-ES', options);
        }
        setInterval(actualizarReloj, 1000);
        actualizarReloj();

        function verificarTurnos() {
            fetch('/obtener_todos_los_turnos?t=' + new Date().getTime())
                .then(r => r.json())
                .then(data => {
                    Object.keys(data).forEach(nV => {
                        let turno = data[nV];
                        if (turno !== estadoActual[nV] && turno > 0) {
                            estadoActual[nV] = turno;
                            let elementId = "turno-" + nV.replace(/ /g, "-");
                            let el = document.getElementById(elementId);
                            if (!el) return;
                            let contenedor = el.closest('.ventanilla');

                            el.innerText = turno;
                            
                            contenedor.classList.add('activar-alerta');
                            setTimeout(() => contenedor.classList.remove('activar-alerta'), 4000);
                            
                            // 1. BAJAR EL VOLUMEN DEL VIDEO SUAVEMENTE AL LLAMAR
                            videoFondo.volume = VOLUMEN_BAJO;

                            let audioCampana = document.getElementById('audio-campana');
                            audioCampana.currentTime = 0;
                            audioCampana.play().catch(e => console.log("Audio campana bloqueado:", e));

                            setTimeout(() => {
                                window.speechSynthesis.cancel(); 
                                
                                let textoLlamada = '';
                                if (nV === "Ventanilla 03") {
                                    textoLlamada = 'Turno número ' + turno + ', por favor, diríjase a la Ventanilla número 3 preferencial';
                                } else {
                                    textoLlamada = 'Turno ' + turno + ', por favor, acérquese a ' + nV;
                                }

                                let msg = new SpeechSynthesisUtterance(textoLlamada);
                                msg.lang = 'es-ES';
                                msg.rate = 0.85; 
                                msg.pitch = 1.0; 
                                
                                if (vocesDisponibles.length === 0) {
                                    vocesDisponibles = window.speechSynthesis.getVoices();
                                }
                                
                                let vozHumana = vocesDisponibles.find(v => (v.name.includes("Google") || v.name.includes("Microsoft")) && v.lang.startsWith('es'));
                                if (!vozHumana) {
                                    vozHumana = vocesDisponibles.find(v => v.lang.startsWith('es'));
                                }
                                
                                if (vozHumana) {
                                    msg.voice = vozHumana;
                                }

                                // 2. RESTAURAR EL VOLUMEN NORMAL CUANDO TERMINE DE HABLAR LA VOZ
                                msg.onend = function() {
                                    videoFondo.volume = VOLUMEN_NORMAL;
                                };

                                window.speechSynthesis.speak(msg);
                            }, 800);
                        }
                    });
                });
        }
        setInterval(verificarTurnos, 2000);
    </script>
</body>
</html>
