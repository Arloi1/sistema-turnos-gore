<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla de Turnos - GORE Cajamarca</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100vh;
            background-color: #0b192c;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Contenedor del video ocupando el espacio superior disponible */
        .video-container {
            position: relative;
            width: 100%;
            flex: 1;
            background: #000;
            overflow: hidden;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Amplía el video cubriendo todo el espacio sin cortes extraños */
            object-position: center top; /* Asegura que se vea la parte superior */
        }

        /* Reloj como marca de agua en la esquina superior izquierda del video */
        .reloj-marca-agua {
            position: absolute;
            top: 20px;
            left: 25px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(6px);
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 700;
            padding: 8px 20px;
            border-radius: 12px;
            letter-spacing: 2px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* Panel inferior de ventanillas maximizado hacia abajo */
        .ventanillas-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px 30px;
            background-color: #f4f6f9;
            width: 100%;
            box-shadow: 0 -8px 25px rgba(0,0,0,0.2);
            z-index: 5;
        }

        .ventanilla-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 15px 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            border-top: 8px solid #ccc;
            transition: all 0.3s ease;
        }

        /* Colores personalizados solicitados */
        .card-v1 { border-top-color: #d9534f; } /* Rojo */
        .card-v2 { border-top-color: #5cb85c; } /* Verde */
        .card-v3 { border-top-color: #0275d8; } /* Azul */

        .ventanilla-titulo {
            font-size: 1.6rem;
            font-weight: 800;
            color: #333333;
            text-transform: uppercase;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .ventanilla-numero {
            font-size: 6.5rem;
            font-weight: 900;
            line-height: 1;
            color: #111111;
        }

        /* Colores de los números acorde a su ventanilla */
        .card-v1 .ventanilla-numero { color: #d9534f; }
        .card-v2 .ventanilla-numero { color: #4cae4c; }
        .card-v3 .ventanilla-numero { color: #0275d8; }

        /* Animación de alerta al llamar o repetir turno */
        @keyframes parpadear {
            0% { transform: scale(1); background-color: #ffffff; }
            50% { transform: scale(1.03); background-color: #fff3cd; }
            100% { transform: scale(1); background-color: #ffffff; }
        }

        .alerta-llamada {
            animation: parpadear 0.8s ease-in-out 3;
        }
    </style>
</head>
<body>

    <!-- Video institucional con el reloj flotando arriba a la izquierda -->
    <div class="video-container">
        <div id="reloj" class="reloj-marca-agua">00:00:00</div>
        <!-- Asegúrate de colocar tu video en la carpeta static/ u o ruta correspondiente -->
        <video autoplay muted loop id="video-institucional">
            <source src="{{ url_for('static', filename='video.mp4') }}" type="video/mp4">
            Tu navegador no soporta la reproducción de video.
        </video>
    </div>

    <!-- Sección inferior de tarjetas de turnos -->
    <div class="ventanillas-grid">
        <!-- Ventanilla 01 (ROJO) -->
        <div class="ventanilla-card card-v1" id="card-Ventanilla 01">
            <div class="ventanilla-titulo">Ventanilla 01</div>
            <div class="ventanilla-numero" id="turno-Ventanilla 01">0</div>
        </div>

        <!-- Ventanilla 02 (VERDE) -->
        <div class="ventanilla-card card-v2" id="card-Ventanilla 02">
            <div class="ventanilla-titulo">Ventanilla 02</div>
            <div class="ventanilla-numero" id="turno-Ventanilla 02">0</div>
        </div>

        <!-- Ventanilla 03 (AZUL - PREFERENCIAL) -->
        <div class="ventanilla-card card-v3" id="card-Ventanilla 03">
            <div class="ventanilla-titulo">Ventanilla 03</div>
            <div class="ventanilla-numero" id="turno-Ventanilla 03">0</div>
        </div>
    </div>

    <audio id="audio-campana" src="{{ url_for('static', filename='campana.mp3') }}"></audio>

    <script>
        // Actualizar reloj en tiempo real
        function actualizarReloj() {
            const ahora = new Date();
            document.getElementById('reloj').innerText = ahora.toLocaleTimeString();
        }
        setInterval(actualizarReloj, 1000);
        actualizarReloj();

        // Control de turnos y detección de repeticiones
        let ultimosTurnos = {
            "Ventanilla 01": { turno: 0, ts: 0 },
            "Ventanilla 02": { turno: 0, ts: 0 },
            "Ventanilla 03": { turno: 0, ts: 0 }
        };

        function verificarTurnos() {
            fetch('/obtener_todos_los_turnos')
                .then(response => response.json())
                .then(data => {
                    for (const [ventanilla, turno] of Object.entries(data)) {
                        const elementoTurno = document.getElementById(`turno-${ventanilla}`);
                        const tarjeta = document.getElementById(`card-${ventanilla}`);
                        
                        if (elementoTurno && turno > 0) {
                            if (ultimosTurnos[ventanilla].turno !== turno) {
                                elementoTurno.innerText = turno;
                                ultimosTurnos[ventanilla].turno = turno;
                                
                                // Lanzar animación y sonido de llamada
                                tarjeta.classList.remove('alerta-llamada');
                                void tarjeta.offsetWidth; // Forzar reflow para reiniciar animación
                                tarjeta.classList.add('alerta-llamada');
                                
                                reproducirAudio();
                            }
                        }
                    }
                })
                .catch(err => console.error("Error sincronizando turnos:", err));
        }

        function reproducirAudio() {
            const audio = document.getElementById('audio-campana');
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log("Audio bloqueado por políticas del navegador:", e));
            }
        }

        // Consultar cada 1.5 segundos
        setInterval(verificarTurnos, 1500);
    </script>
</body>
</html>
